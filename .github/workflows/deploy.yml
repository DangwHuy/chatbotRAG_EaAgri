name: Deploy Bộ Não Nông Nghiệp AI
on:
  push:
    branches: [ main ] 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Kết nối SSH, Pull code & Restart API
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /root/my_fastapi_app
          git pull origin main
          pkill -f "python [m]ain.py" || true
          pkill -f "python [a]pp_ai.py" || true
          source venv/bin/activate
          pip install -r chatbot/requirements.txt || true
          nohup python main.py > log_main.txt 2>&1 &
          nohup python app_ai.py > log_ai.txt 2>&1 &
