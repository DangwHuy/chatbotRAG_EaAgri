name: Deploy Bộ Não Nông Nghiệp AI
on:
  push:
    branches: [ main ] 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Kết nối SSH, Pull code & Restart API
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /root/my_fastapi_app
          git pull origin main
          fuser -k 8000/tcp || true
          fuser -k 8001/tcp || true
          ps aux | awk '$11 ~ /python/ && $0 ~ /main\.py/ {print $2}' | xargs -r kill -9 || true
          ps aux | awk '$11 ~ /python/ && $0 ~ /app_ai\.py/ {print $2}' | xargs -r kill -9 || true
          venv/bin/pip install -r chatbot/requirements.txt || true
          nohup venv/bin/python main.py > log_main.txt 2>&1 &
          nohup venv/bin/python app_ai.py > log_ai.txt 2>&1 &
